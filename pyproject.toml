[project]
name = "workforce-scheduling-ai"
version = "0.1.0"
description = "Workforce scheduling AI experiments and planning engine"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0.0",
    "torch>=2.4.0",
    "zarr>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
